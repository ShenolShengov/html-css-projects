<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <title>Frontend Mentor | QR code component</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="output.css">
</head>

<body class="min-h-dvh flex justify-center items-center bg-slate-300">
  <div class="qr-code bg-white w-[21em] pb-8 p-4 flex flex-col gap-5 rounded-2xl text-center shadow-lg">
    <div class="qr-image rounded-xl overflow-hidden">
      <img src="images/image-qr-code.png" alt="QR code image">
    </div>
    <p class="text-2xl font-bold text-slate-900 px-1">Improve your front-end skills by building projects</p>
    <p class="text-slate-500 px-4">Scan the QR code to visit Frontend Mentor and take your coding skills to the next
      level</p>
  </div>
</body>

</html>
