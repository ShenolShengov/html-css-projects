<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="styles.css">
  <title>Frontend Mentor | Product preview card component</title>
</head>

<body>

  <div class="site d-flex justify-center align-center">
    <div class="preview-card-component d-flex">
      <div class="product-image basis-50 d-flex direction-column">
          <img src="images/image-product-mobile.jpg" width="400px" class="grow-1" alt="Product image">
      </div>

      <div class="product-information d-flex direction-column basis-50 gap-normal">
        <h4 class="product-type">Perfume</h4>

        <h1 class="product-name">Gabrielle Essence Eau De Parfum</h1>

        <p class="product-description">A floral, solar and voluptuous interpretation composed by Olivier Polge,
          Perfumer-Creator for the House of CHANEL.
        </p>

        <div class="product-price d-flex gap-small align-center">
          <h2 class="active-price">$149.99</h2>
          <h5 class="old-price">$169.99</h5>
        </div>

        <div class="add-to-cart-btn d-flex gap-small justify-center align-center">
          <div class="img-container">
            <img src="images/icon-cart.svg" alt="">
          </div>
          Add to Cart
        </div>
      </div>
    </div>
  </div>

</body>

</html>
